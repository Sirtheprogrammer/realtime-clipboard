name: CI & Automated Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
      - 'ext-v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Run Tests
        run: go test -v ./...

  build-and-release:
    name: Build Packages & Publish Release
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Install Utilities
        run: sudo apt-get update && sudo apt-get install -y zip jq

      - name: Determine Version & Tag
        id: vars
        run: |
          VERSION=$(jq -r .version extension/manifest.json)
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            VERSION="1.1.0"
          fi
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME="v${VERSION}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "Building release for tag: $TAG_NAME (Version: $VERSION)"

      - name: Package Browser Extensions
        run: |
          mkdir -p dist
          # Package Chromium extension (Chrome, Edge, Brave, Opera)
          (cd extension && zip -r ../dist/clipboard-vault-chrome.zip . -x "*.go" -x "*_test.go" -x "*.DS_Store")
          
          # Package Firefox extension (zip and xpi)
          (cd extension && zip -r ../dist/clipboard-vault-firefox.zip . -x "*.go" -x "*_test.go" -x "*.DS_Store")
          cp dist/clipboard-vault-firefox.zip dist/clipboard-vault-firefox.xpi

      - name: Build Server Binaries
        run: |
          echo "Cross-compiling server binaries..."
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/clipboard-server-linux-amd64 ./cmd/server
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/clipboard-server-linux-arm64 ./cmd/server
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/clipboard-server-windows-amd64.exe ./cmd/server
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o dist/clipboard-server-darwin-arm64 ./cmd/server

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt
          cd ..

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clipboard-vault-${{ env.TAG_NAME }}
          path: dist/*
          retention-days: 30

      - name: Publish or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Push tag if it does not already exist
          if ! git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            git tag "$TAG_NAME"
            git push origin "$TAG_NAME" || true
          fi

          RELEASE_NOTES="### Clipboard Vault Release $TAG_NAME

#### What's Included:
- **Browser Extension (Chromium)**: \`clipboard-vault-chrome.zip\` (Chrome, Edge, Brave, Arc, Opera)
- **Browser Extension (Firefox)**: \`clipboard-vault-firefox.zip\` and \`clipboard-vault-firefox.xpi\`
- **Pre-built Server Binaries**:
  - Linux AMD64: \`clipboard-server-linux-amd64\`
  - Linux ARM64: \`clipboard-server-linux-arm64\`
  - Windows AMD64: \`clipboard-server-windows-amd64.exe\`
  - macOS Apple Silicon: \`clipboard-server-darwin-arm64\`

#### Key Features:
- Realtime peer clipboard synchronization (WebSocket + fallback)
- Hardware-grade envelope encrypted Secret & Password Vault (AES-256-GCM)
- Automatic credential detection, 1-click autofill, and auto-saving
- Automatic API key detection for GitHub, OpenAI, Claude, Stripe, Google, Groq, AWS
- In-browser automatic extension updates"

          # 1. Create or update versioned release
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME exists. Uploading fresh assets..."
            gh release upload "$TAG_NAME" dist/* --clobber
          else
            echo "Creating versioned release $TAG_NAME..."
            gh release create "$TAG_NAME" dist/* \
              --title "Clipboard Vault $TAG_NAME" \
              --notes "$RELEASE_NOTES"
          fi

          # 2. Also maintain a rolling 'latest' release for direct permanent links
          if gh release view "latest" >/dev/null 2>&1; then
            echo "Updating rolling 'latest' release assets..."
            gh release upload "latest" dist/* --clobber
          else
            echo "Creating rolling 'latest' release..."
            gh release create "latest" dist/* \
              --title "Clipboard Vault (Latest Build)" \
              --notes "Rolling release reflecting the latest commit on main branch." \
              --prerelease=false
          fi
