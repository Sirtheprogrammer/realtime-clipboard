name: "CI and Automated Release"

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
      - 'ext-v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: "Run Test Suite"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Run Tests
        run: go test -v ./...

  build-and-release:
    name: "Build Packages and Publish Release"
    runs-on: ubuntu-latest
    needs: test
    if: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))) || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Install Utilities
        run: sudo apt-get update && sudo apt-get install -y zip jq

      - name: Determine Version and Tag
        id: vars
        run: |
          VERSION=$(jq -r .version extension/manifest.json)
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            VERSION="1.1.0"
          fi
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME="v${VERSION}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "Building release for tag: $TAG_NAME (Version: $VERSION)"

      - name: Package Browser Extensions
        run: |
          mkdir -p dist
          # Package Chromium extension (Chrome, Edge, Brave, Opera: service_worker only)
          mkdir -p /tmp/chrome-ext
          cp -r extension/* /tmp/chrome-ext/
          jq 'del(.background.scripts)' extension/manifest.json > /tmp/chrome-ext/manifest.json
          (cd /tmp/chrome-ext && zip -r ../../dist/clipboard-vault-chrome.zip . -x "*.go" -x "*_test.go" -x "*.DS_Store")

          # Package Firefox extension (AMO compliant: scripts only, no service_worker)
          mkdir -p /tmp/firefox-ext
          cp -r extension/* /tmp/firefox-ext/
          jq 'del(.background.service_worker)' extension/manifest.json > /tmp/firefox-ext/manifest.json
          (cd /tmp/firefox-ext && zip -r ../../dist/clipboard-vault-firefox.zip . -x "*.go" -x "*_test.go" -x "*.DS_Store")
          cp dist/clipboard-vault-firefox.zip dist/clipboard-vault-firefox.xpi

      - name: Build Server Binaries
        run: |
          echo "Cross-compiling server binaries..."
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/clipboard-server-linux-amd64 ./cmd/server
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/clipboard-server-linux-arm64 ./cmd/server
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/clipboard-server-windows-amd64.exe ./cmd/server
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o dist/clipboard-server-darwin-arm64 ./cmd/server

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt
          cd ..

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clipboard-vault-packages
          path: dist/*
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: ${{ startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' }}
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "Clipboard Vault ${{ env.TAG_NAME }}"
          body: |
            ## Automated Release ${{ env.TAG_NAME }}

            ### Included Artifacts
            - **Firefox Extension**: `clipboard-vault-firefox.zip` / `clipboard-vault-firefox.xpi` (AMO Compliant)
            - **Chrome / Chromium Extension**: `clipboard-vault-chrome.zip` (Manifest V3)
            - **Linux amd64 / arm64**: `clipboard-server-linux-amd64`, `clipboard-server-linux-arm64`
            - **Windows x64**: `clipboard-server-windows-amd64.exe`
            - **macOS Apple Silicon**: `clipboard-server-darwin-arm64`

            Verify file checksums using `checksums.txt`.
          files: |
            dist/clipboard-vault-chrome.zip
            dist/clipboard-vault-firefox.zip
            dist/clipboard-vault-firefox.xpi
            dist/clipboard-server-linux-amd64
            dist/clipboard-server-linux-arm64
            dist/clipboard-server-windows-amd64.exe
            dist/clipboard-server-darwin-arm64
            dist/checksums.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
